name: Research artifact CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev,data]'
      - name: Static checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests and offline CPU reproduction
        run: python scripts/reproduce_minimal.py --output experiments/minimal
      - name: Audit archived results without rerunning experiments
        run: python scripts/final_audit.py --output experiments/ci-audit
      - name: Build and inspect wheel
        run: |
          python -m pip wheel --no-deps . -w dist
          python scripts/check_wheel.py dist
