[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "consensuscensor"
version = "0.1.0"
description = "Open research artifact on consensus filtering and robust preference estimation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas"]
[project.optional-dependencies]
dev = ["pytest", "ruff"]
data = ["pyarrow"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "ANN"]
